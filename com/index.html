<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML PDF Compiler • XARK</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <a href="../">← XARK</a>
  <b>HTML PDF Compiler</b>
  <span>Browser-only</span>
</header>

<div class="app">

  <section class="editor">
    <h1>HTML → PDF</h1>
    <p class="intro">Paste HTML, preview it on A4, and export it as a PDF.</p>

    <label>
      HTML
      <textarea id="htmlInput" spellcheck="false"
        placeholder="Paste your complete HTML here..."></textarea>
    </label>

    <div class="controls">
      <label>
        Page size
        <select id="pageSize">
          <option value="A4" selected>A4</option>
          <option value="Letter">Letter</option>
          <option value="A5">A5</option>
        </select>
      </label>

      <label>
        Orientation
        <select id="orientation">
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </label>

      <label>
        Margin
        <select id="margin">
          <option value="8">8 mm</option>
          <option value="12" selected>12 mm</option>
          <option value="15">15 mm</option>
          <option value="20">20 mm</option>
          <option value="25">25 mm</option>
        </select>
      </label>
    </div>

    <div class="actions">
      <button id="previewBtn">Update Preview</button>
      <button id="pdfBtn">Download PDF</button>
      <button id="printBtn" class="secondary">Print / Save PDF</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <p id="status" class="status"></p>
    <p class="privacy">
      HTML is processed in your browser. No backend is required.
    </p>
  </section>

  <section class="preview-area">
    <div class="preview-label">LIVE A4 PREVIEW</div>
    <div id="preview"></div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
