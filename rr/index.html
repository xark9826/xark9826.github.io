<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Report Writer • XARK</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header>
  <a href="../">← XARK</a>

  <b>Report Writer</b>

  <span>Free • Browser-only</span>
</header>


<div class="layout">

  <!-- =========================
       EDITOR
  ========================== -->

  <aside>

    <h2>Report Details</h2>

    <label>
      Report Title

      <textarea
        id="title"
        rows="5"
        placeholder="Enter your report title..."
      ></textarea>
    </label>


    <label>
      Assessment Type

      <input
        id="assessment"
        type="text"
        placeholder="e.g. SEC – Internal Assessment"
      >
    </label>


    <label>
      Department

      <input
        id="department"
        type="text"
        placeholder="e.g. Department of English"
      >
    </label>


    <label>
      University / Institution

      <input
        id="university"
        type="text"
        placeholder="Enter university name..."
      >
    </label>


    <label>
      Student Name

      <input
        id="student"
        type="text"
        placeholder="Enter your name..."
      >
    </label>


    <label>
      Year / Semester

      <input
        id="semester"
        type="text"
        placeholder="e.g. UG 2nd Year – 3rd Semester"
      >
    </label>


    <h2>Heading Alignment</h2>

    <select id="align">

      <option value="left">
        Left
      </option>

      <option value="center">
        Center
      </option>

      <option value="right">
        Right
      </option>

    </select>


    <!-- =========================
         EXECUTIVE SUMMARY
    ========================== -->

    <h2>Executive Summary</h2>

    <textarea
      id="summary"
      rows="14"
      placeholder="Write your executive summary here...

Separate paragraphs with one blank line."
    ></textarea>


    <!-- =========================
         REPORT
    ========================== -->

    <h2>Report</h2>

    <textarea
      id="report"
      rows="20"
      placeholder="Write your report here...

Separate paragraphs with one blank line."
    ></textarea>


    <!-- =========================
         REFERENCES
    ========================== -->

    <h2>References</h2>

    <textarea
      id="refs"
      rows="12"
      placeholder="Enter your references here...

Example:

1. Author, Name. Title. Publisher, Year.

2. Author, Name. Title. Publisher, Year."
    ></textarea>


    <!-- =========================
         ACTIONS
    ========================== -->

    <button
      type="button"
      onclick="window.print()"
    >
      Print / Save PDF
    </button>


    <button
      type="button"
      class="secondary"
      onclick="clearAll()"
    >
      Clear All
    </button>

  </aside>


  <!-- =========================
       LIVE PREVIEW
  ========================== -->

  <main id="preview">

  </main>

</div>


<script>

/* =========================================
   ELEMENT HELPER
========================================= */

const $ = id => document.getElementById(id);


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

}


/* =========================================
   CONVERT TEXT TO PARAGRAPHS
========================================= */

function createParagraphs(text, reference = false) {

  return String(text || "")
    .split(/\n\s*\n/)
    .map(paragraph => paragraph.trim())
    .filter(Boolean)
    .map(paragraph => {

      const safeText = escapeHTML(paragraph)
        .replace(/\n/g, "<br>");

      return `
        <p class="${reference ? "ref" : "p"}">
          ${safeText}
        </p>
      `;

    })
    .join("");

}


/* =========================================
   RENDER REPORT
========================================= */

function renderReport() {

  const title =
    $("title").value;

  const assessment =
    $("assessment").value;

  const department =
    $("department").value;

  const university =
    $("university").value;

  const student =
    $("student").value;

  const semester =
    $("semester").value;

  const alignment =
    $("align").value;

  const summary =
    $("summary").value;

  const report =
    $("report").value;

  const references =
    $("refs").value;


  /* =====================================
     PAGE 1 — TITLE
  ===================================== */

  const titlePage = `

    <section class="preview title">

      <div class="no">
        Islam 1
      </div>

      <h1>
        ${escapeHTML(title)}
      </h1>


      <div class="meta">

        ${escapeHTML(assessment)}

        <br>

        ${escapeHTML(department)}

        <br>

        ${escapeHTML(university)}

      </div>


      <div class="submitted">

        Submitted by

        <br>

        <b>
          ${escapeHTML(student)}
        </b>

        <br>

        ${escapeHTML(semester)}

      </div>

    </section>

  `;


  /* =====================================
     PAGE 2 — EXECUTIVE SUMMARY
  ===================================== */

  const summaryPage = `

    <section class="preview">

      <div class="no">
        Islam 2
      </div>


      <h2
        class="section"
        style="text-align:${alignment}"
      >
        Executive Summary
      </h2>


      ${createParagraphs(summary)}

    </section>

  `;


  /* =====================================
     PAGE 3 — REPORT
  ===================================== */

  const reportPage = `

    <section class="preview">

      <div class="no">
        Islam 3
      </div>


      <h2
        class="section"
        style="text-align:${alignment}"
      >
        Report
      </h2>


      ${createParagraphs(report)}

    </section>

  `;


  /* =====================================
     PAGE 4 — REFERENCES
  ===================================== */

  const referencePage = `

    <section class="preview refs">

      <div class="no">
        Islam 4
      </div>


      <h2
        class="section"
        style="text-align:${alignment}"
      >
        References
      </h2>


      ${createParagraphs(references, true)}

    </section>

  `;


  $("preview").innerHTML =

    titlePage +
    summaryPage +
    reportPage +
    referencePage;

}


/* =========================================
   CLEAR EVERYTHING
========================================= */

function clearAll() {

  const fields = [

    "title",
    "assessment",
    "department",
    "university",
    "student",
    "semester",
    "summary",
    "report",
    "refs"

  ];


  fields.forEach(id => {

    $(id).value = "";

  });


  $("align").value = "left";


  renderReport();

}


/* =========================================
   LIVE PREVIEW
========================================= */

const fields = [

  "title",
  "assessment",
  "department",
  "university",
  "student",
  "semester",
  "align",
  "summary",
  "report",
  "refs"

];


fields.forEach(id => {

  $(id).addEventListener(
    "input",
    renderReport
  );


  $(id).addEventListener(
    "change",
    renderReport
  );

});


/* =========================================
   INITIAL LOAD
========================================= */

/*
  IMPORTANT:
  There is intentionally NO localStorage here.

  Every time the page opens or refreshes,
  all fields start completely empty.
*/

renderReport();

</script>

</body>
</html>
