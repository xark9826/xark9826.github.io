<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Report Writer • XARK</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <a href="../">
    ← XARK
  </a>

  <b>
    Report Writer
  </b>

  <span>
    Free • Browser-only
  </span>

</header>



<!-- =====================================================
     MAIN LAYOUT
===================================================== -->

<div class="layout">


  <!-- ===================================================
       EDITOR
  ==================================================== -->

  <aside>


    <h2>
      Report Details
    </h2>


    <!-- REPORT TITLE -->

    <label>

      Report Title

      <textarea
        id="title"
        rows="5"
        placeholder="Enter your report title..."
      ></textarea>

    </label>



    <!-- ASSESSMENT -->

    <label>

      Assessment Type

      <input
        id="assessment"
        type="text"
        placeholder="e.g. SEC – Internal Assessment"
      >

    </label>



    <!-- DEPARTMENT -->

    <label>

      Department

      <input
        id="department"
        type="text"
        placeholder="e.g. Department of English"
      >

    </label>



    <!-- UNIVERSITY -->

    <label>

      University / Institution

      <input
        id="university"
        type="text"
        placeholder="Enter university name..."
      >

    </label>



    <!-- STUDENT NAME -->

    <label>

      Student Name

      <input
        id="student"
        type="text"
        placeholder="Enter your full name..."
      >

    </label>



    <!-- SEMESTER -->

    <label>

      Year / Semester

      <input
        id="semester"
        type="text"
        placeholder="e.g. UG 2nd Year – 3rd Semester"
      >

    </label>



    <!-- =================================================
         HEADING ALIGNMENT
    ================================================== -->

    <h2>
      Heading Alignment
    </h2>


    <select id="align">

      <option value="left">
        Left
      </option>

      <option value="center">
        Center
      </option>

      <option value="right">
        Right
      </option>

    </select>



    <!-- =================================================
         EXECUTIVE SUMMARY
    ================================================== -->

    <h2>
      Executive Summary
    </h2>


    <textarea
      id="summary"
      rows="14"
      placeholder="Write your executive summary here...

Separate paragraphs with one blank line."
    ></textarea>



    <!-- =================================================
         REPORT
    ================================================== -->

    <h2>
      Report
    </h2>


    <textarea
      id="report"
      rows="20"
      placeholder="Write your report here...

Separate paragraphs with one blank line."
    ></textarea>



    <!-- =================================================
         REFERENCES
    ================================================== -->

    <h2>
      References
    </h2>


    <textarea
      id="refs"
      rows="12"
      placeholder="Enter your references here...

Example:

1. Author, Name. Title. Publisher, Year.

2. Author, Name. Title. Publisher, Year."
    ></textarea>



    <!-- =================================================
         ACTION BUTTONS
    ================================================== -->

    <button
      type="button"
      onclick="window.print()"
    >
      Print / Save PDF
    </button>


    <button
      type="button"
      class="secondary"
      onclick="clearAll()"
    >
      Clear All
    </button>


  </aside>



  <!-- ===================================================
       LIVE A4 PREVIEW
  ==================================================== -->

  <main id="preview">

  </main>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   ELEMENT HELPER
===================================================== */

const $ = (id) => {

  return document.getElementById(id);

};



/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;");

}



/* =====================================================
   GET LAST NAME
=====================================================

   Examples:

   Nur Islam
   → Islam

   Arman Ahmed Khan
   → Khan

   Rahul Sharma
   → Sharma

===================================================== */

function getLastName() {


  const fullName =
    $("student").value.trim();


  /* No name entered */

  if (!fullName) {

    return "";

  }


  /* Remove extra spaces */

  const parts =
    fullName.split(/\s+/);


  /* Last word = surname */

  return parts[parts.length - 1];


}



/* =====================================================
   PAGE LABEL
=====================================================

   If surname exists:

   Islam 1

   Otherwise:

   1

===================================================== */

function pageLabel(number) {


  const surname =
    getLastName();


  if (!surname) {

    return String(number);

  }


  return `${escapeHTML(surname)} ${number}`;

}



/* =====================================================
   TEXT → PARAGRAPHS
===================================================== */

function createParagraphs(
  text,
  reference = false
) {


  return String(text || "")

    /* Separate paragraphs using blank lines */

    .split(/\n\s*\n/)

    /* Remove unnecessary spaces */

    .map(
      paragraph =>
        paragraph.trim()
    )

    /* Remove completely empty paragraphs */

    .filter(Boolean)

    /* Create HTML */

    .map(paragraph => {


      const safeText =

        escapeHTML(paragraph)

          .replace(
            /\n/g,
            "<br>"
          );


      return `

        <p class="${reference ? "ref" : "p"}">

          ${safeText}

        </p>

      `;

    })

    .join("");

}



/* =====================================================
   RENDER REPORT
===================================================== */

function renderReport() {


  /* ===================================================
     GET VALUES
  ================================================== */

  const title =
    $("title").value;


  const assessment =
    $("assessment").value;


  const department =
    $("department").value;


  const university =
    $("university").value;


  const student =
    $("student").value;


  const semester =
    $("semester").value;


  const alignment =
    $("align").value;


  const summary =
    $("summary").value;


  const report =
    $("report").value;


  const references =
    $("refs").value;



  /* ===================================================
     PAGE 1 — TITLE PAGE
  ================================================== */

  const titlePage = `

    <section class="preview title">


      <div class="no">

        ${pageLabel(1)}

      </div>



      <h1>

        ${escapeHTML(title)}

      </h1>



      <div class="meta">

        ${escapeHTML(assessment)}

        <br>

        ${escapeHTML(department)}

        <br>

        ${escapeHTML(university)}

      </div>



      <div class="submitted">

        Submitted by

        <br>

        <b>

          ${escapeHTML(student)}

        </b>

        <br>

        ${escapeHTML(semester)}

      </div>


    </section>

  `;



  /* ===================================================
     PAGE 2 — EXECUTIVE SUMMARY
  ================================================== */

  const summaryPage = `

    <section class="preview">


      <div class="no">

        ${pageLabel(2)}

      </div>



      <h2
        class="section"
        style="text-align:${alignment}"
      >

        Executive Summary

      </h2>



      ${createParagraphs(summary)}


    </section>

  `;



  /* ===================================================
     PAGE 3 — REPORT
  ================================================== */

  const reportPage = `

    <section class="preview">


      <div class="no">

        ${pageLabel(3)}

      </div>



      <h2
        class="section"
        style="text-align:${alignment}"
      >

        Report

      </h2>



      ${createParagraphs(report)}


    </section>

  `;



  /* ===================================================
     PAGE 4 — REFERENCES
  ================================================== */

  const referencePage = `

    <section class="preview refs">


      <div class="no">

        ${pageLabel(4)}

      </div>



      <h2
        class="section"
        style="text-align:${alignment}"
      >

        References

      </h2>



      ${createParagraphs(
        references,
        true
      )}


    </section>

  `;



  /* ===================================================
     INSERT INTO PREVIEW
  ================================================== */

  $("preview").innerHTML =

    titlePage +

    summaryPage +

    reportPage +

    referencePage;


}



/* =====================================================
   CLEAR ALL
===================================================== */

function clearAll() {


  const fields = [

    "title",

    "assessment",

    "department",

    "university",

    "student",

    "semester",

    "summary",

    "report",

    "refs"

  ];


  fields.forEach(
    id => {

      $(id).value = "";

    }
  );


  /* Default heading alignment */

  $("align").value =
    "left";


  /* Re-render */

  renderReport();

}



/* =====================================================
   LIVE PREVIEW
===================================================== */

const fields = [

  "title",

  "assessment",

  "department",

  "university",

  "student",

  "semester",

  "align",

  "summary",

  "report",

  "refs"

];



fields.forEach(id => {


  $(id).addEventListener(
    "input",
    renderReport
  );


  $(id).addEventListener(
    "change",
    renderReport
  );


});



/* =====================================================
   INITIAL PAGE LOAD
=====================================================

   IMPORTANT:

   No localStorage.
   No default values.
   No saved information.

   Every page load starts fresh.

===================================================== */

renderReport();


</script>


</body>

</html>
