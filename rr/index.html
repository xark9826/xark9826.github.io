<h2>Executive Summary</h2>
<textarea id="summary" rows="10">Generative artificial intelligence has rapidly become part of academic life. Undergraduate students can use generative AI to brainstorm ideas, understand difficult concepts, improve language, organise information and receive feedback.

At the same time, undisclosed or inappropriate use raises concerns about academic integrity, authorship, accuracy, privacy and the development of independent learning skills.

This paper examines these concerns and proposes an institutional policy that permits responsible educational uses while establishing clear boundaries for assessed work.</textarea>

<h2>Report</h2>
<textarea id="report" rows="14">Generative artificial intelligence refers to systems capable of producing new content such as text, images, audio, video and computer code in response to user instructions. Its rapid development has changed how students search for information, prepare written work and approach academic problems.

The central institutional question is therefore not simply whether students should be allowed to use AI. It is how universities can establish conditions under which AI can support learning without replacing the intellectual work that an assessment is intended to measure.

Generative AI can support learning when it is used as an aid rather than as a substitute for academic engagement.</textarea>
